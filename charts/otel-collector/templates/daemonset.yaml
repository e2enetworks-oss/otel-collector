apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "otel-collector.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "otel-collector.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: otel-collector
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      tolerations:
        # Run on all nodes including control-plane
        - operator: Exists
      containers:
        - name: otel-collector
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args: ["--config=/etc/otel/config.yaml"]
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if .Values.gateway.tokenSecret }}
            - name: CLUSTER_INGESTION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.tokenSecret.name }}
                  key: {{ .Values.gateway.tokenSecret.key }}
            {{- end }}
          ports:
            {{- if .Values.otlp.enabled }}
            - name: otlp-grpc
              containerPort: {{ .Values.otlp.grpc.port }}
              hostPort: {{ .Values.otlp.grpc.port }}
            - name: otlp-http
              containerPort: {{ .Values.otlp.http.port }}
              hostPort: {{ .Values.otlp.http.port }}
            {{- end }}
            - name: health
              containerPort: 13133
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otel
            {{- if and .Values.logs.enabled .Values.logs.kubernetes.enabled }}
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            {{- end }}
            {{- if and .Values.logs.enabled .Values.logs.journald.enabled }}
            - name: journald
              mountPath: /run/log/journal
              readOnly: true
            {{- end }}
            {{- if .Values.hubble.enabled }}
            - name: hubble-events
              mountPath: /var/run/cilium/hubble
              readOnly: true
            {{- end }}
            {{- if .Values.hostmetrics.enabled }}
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
              mountPropagation: HostToContainer
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        {{- if and .Values.logs.enabled .Values.logs.kubernetes.enabled }}
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        {{- end }}
        {{- if and .Values.logs.enabled .Values.logs.journald.enabled }}
        - name: journald
          hostPath:
            path: /run/log/journal
        {{- end }}
        {{- if .Values.hubble.enabled }}
        - name: hubble-events
          hostPath:
            path: /var/run/cilium/hubble
        {{- end }}
        {{- if .Values.hostmetrics.enabled }}
        - name: hostfs
          hostPath:
            path: /
        {{- end }}
