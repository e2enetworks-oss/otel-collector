{{- if .Values.otlp.enabled }}
# ClusterIP service so application pods in this cluster can send
# traces + metrics to the OTel Collector via in-cluster DNS
# instead of relying on hostPort.
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "otel-collector.selectorLabels" . | nindent 4 }}
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: {{ .Values.otlp.grpc.port }}
      targetPort: {{ .Values.otlp.grpc.port }}
      protocol: TCP
    - name: otlp-http
      port: {{ .Values.otlp.http.port }}
      targetPort: {{ .Values.otlp.http.port }}
      protocol: TCP
    - name: health
      port: 13133
      targetPort: 13133
      protocol: TCP
{{- end }}
