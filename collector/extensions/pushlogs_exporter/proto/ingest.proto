// Ingest service subset — only what the pushlogs exporter needs.
// Go stubs are generated by the Dockerfile build stage via protoc.
syntax = "proto3";

package e2e.observability.v1;

option go_package = "awakeninggit.e2enetworks.net/infra/e2e-otel-collector-app/extensions/pushlogs_exporter/proto;ingestpb";

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_DEBUG       = 1;
  LOG_LEVEL_INFO        = 2;
  LOG_LEVEL_WARN        = 3;
  LOG_LEVEL_ERROR       = 4;
  LOG_LEVEL_FATAL       = 5;
}

message TraceContext {
  string trace_id       = 1;
  string span_id        = 2;
  string parent_span_id = 3;
  uint32 trace_flags    = 4;
}

message LogEvent {
  int64              timestamp     = 1;
  string             message       = 2;
  LogLevel           level         = 3;
  map<string,string> metadata      = 4;
  optional TraceContext trace_context = 5;
}

message PushLogsRequest {
  string            log_group  = 1;
  string            log_stream = 2;
  repeated LogEvent log_events = 3;
}

message PushLogsResponse {
  reserved 1;
  uint32 accepted = 2;
  uint32 rejected = 3;
}

service LogIngestService {
  rpc PushLogs(PushLogsRequest)                        returns (PushLogsResponse);
  rpc PushLogStream(stream PushLogsRequest)            returns (PushLogsResponse);
}
