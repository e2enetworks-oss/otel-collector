# golangci-lint config — applies to the collector Go source (generated by ocb)
# that lands in a follow-up PR. Kept in sync with the version pinned in the
# Makefile (GOLANGCI_VERSION) and the E2E house style (terraform-provider-e2e).
version: 2

run:
  timeout: 10m

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - unconvert

  exclusions:
    rules:
      # ocb emits generated entrypoints (components.go, main.go) — don't gate on them.
      - path: "(^|/)(components|main)\\.go$"
        linters:
          - errcheck
          - unused
