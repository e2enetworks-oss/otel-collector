name: Lint

on:
  push:
    branches: [main, otel-collector]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (shell + go)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go_version: ['1.27.1', '1.26.8']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go_version }}
          cache: false

      # shellcheck is preinstalled on ubuntu-latest runners.
      - name: Show tool versions
        run: shellcheck --version | head -2

      - name: Lint (shellcheck → go)
        run: make lint

      - name: Install bats
        run: sudo apt-get update -q && sudo apt-get install -y bats

      - name: Run bats tests
        run: make test
