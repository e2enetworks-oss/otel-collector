name: Lint

on:
  push:
    branches: [main, otel-collector]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (shell + go + helm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      # helm is needed once the chart lands; harmless until then (targets skip).
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      # shellcheck is preinstalled on ubuntu-latest runners.
      - name: Show tool versions
        run: |
          shellcheck --version | head -2
          helm version --short

      - name: Lint (shellcheck → go → helm)
        run: make lint

      - name: Validate Helm manifests
        run: make validate
