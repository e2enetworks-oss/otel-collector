name: Gitleaks Secret Scan

on:
  push:
    branches: [main, otel-collector]
  pull_request:
    branches: [main]

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Use the gitleaks CLI directly. The gitleaks-action@v2 wrapper requires a
      # paid GITLEAKS_LICENSE for organization accounts; the binary is free and
      # scans the full history identically.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan for secrets
        run: gitleaks detect --no-banner --redact --verbose --exit-code 1
