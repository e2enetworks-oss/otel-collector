name: Publish install assets to GitHub Pages

# Publishes the E2E installer and configuration. Collector archives and
# checksums are downloaded directly from the official OpenTelemetry release.

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'site/**'
      - 'samples/**'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; never cancel an in-progress deploy mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble Pages site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Assemble publish directory (index + install.sh + samples)
        run: |
          mkdir -p public/samples
          cp site/index.html       public/index.html
          cp install.sh             public/install.sh
          cp samples/vm-config.yaml public/samples/vm-config.yaml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
